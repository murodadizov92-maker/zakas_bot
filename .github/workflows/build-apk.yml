name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['app/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Logo
        continue-on-error: true
        run: |
          if [ -f logo.png ]; then
            mkdir -p assets && cp logo.png assets/icon.png
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
          fi
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MeatCity.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Meat City APK #${{ github.run_number }}
          files: app/MeatCity.apk