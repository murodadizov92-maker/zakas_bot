      - name: Logo
        run: |
          if [ -f logo.png ]; then
            mkdir -p assets
            convert logo.png -background white -alpha remove -alpha off -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon-only.png
            convert logo.png -background none -resize 680x680 -gravity center -extent 1024x1024 assets/icon-foreground.png
            convert -size 1024x1024 xc:white assets/icon-background.png
            npx capacitor-assets generate --android
          fi
- run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MeatCity.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Meat City APK #${{ github.run_number }}
          files: app/MeatCity.apk