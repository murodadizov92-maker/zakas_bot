<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meat City</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>html{zoom:.8}
:root{--red:#b00d30;--red2:#c4143a;--bg:#f6f4f3;--card:#fff;--tx:#222;--mut:#8a8583;--line:#ece8e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit}
.hdr{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;padding:14px 16px 16px}
.hdr small{opacity:.8;display:block}.hdr b{font-size:20px}
.search{margin-top:10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:11px 14px;width:100%;color:#fff;outline:0}
.search::placeholder{color:rgba(255,255,255,.75)}
.row{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:16px;padding:9px 16px;color:#555}
.chip.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.day{flex:0 0 auto;min-width:62px;text-align:center;border-radius:16px;background:#fff;border:1px solid var(--line);padding:8px 10px;line-height:1.25}
.day small{display:block;color:var(--mut);font-size:12px}.day b{font-size:20px}
.day.on{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(176,13,48,.35)}.day.on small{color:#fff}
.day.off{opacity:.45;border-style:dashed;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 12px 110px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.img{aspect-ratio:1/0.95;background:#fbf0ec;display:flex;align-items:center;justify-content:center;font-size:54px;background-size:cover;background-position:center}
.card .in{padding:10px 12px 12px}.nm{font-weight:700;font-size:15px;line-height:1.25;min-height:38px}
.pr{color:var(--mut);margin:4px 0 8px}
.qty{display:flex;gap:6px;align-items:center}
.qty button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#f6f4f3;font-size:20px}
.qty input{flex:1;min-width:0;height:38px;text-align:center;border:1px solid var(--line);border-radius:12px;background:#f6f4f3}
.unit{text-align:center;color:var(--mut);font-size:13px;margin-top:6px;text-transform:uppercase}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--mut);font-size:12px}
.nav button i{display:block;font-style:normal;font-size:24px}.nav button.on{color:var(--red);font-weight:700}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:2px}
.page{padding:14px 14px 100px}.page h2{margin:4px 0 12px}
.box{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px;width:100%;font-weight:700;font-size:16px}
.btn.sm{padding:8px 12px;width:auto;font-size:14px;border-radius:10px}.btn.gray{background:#e9e5e3;color:#333}
.inp{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0}
.mut{color:var(--mut);font-size:13px}.err{color:#c00;margin:8px 0;min-height:20px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px}
.login img{width:110px;height:110px;object-fit:contain;margin:0 auto 14px;display:block}
.login h1{text-align:center;margin:0 0 20px;color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff;text-align:center}
.ov img{max-width:100%;max-height:70vh;border-radius:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;max-width:90%}
.load{text-align:center;color:var(--mut);padding:40px 20px}
.vcard{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
.vimg{position:relative;background:#fff;height:170px;display:flex;align-items:center;justify-content:center;padding:8px}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vcard.busy .vimg img{opacity:.3;filter:grayscale(1)}
.vwarn{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);background:rgba(176,13,48,.93);color:#fff;font-weight:700;text-align:center;padding:10px 12px;border-radius:12px}
.vb{position:absolute;top:10px;right:12px;font-size:13px;padding:2px 8px}
.vin{padding:10px 14px 14px;border-top:1px solid var(--line)}.vin b{font-size:18px}
.gb{color:var(--red);font-weight:600;margin-top:4px;font-size:13px}
.fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:34px;line-height:1;box-shadow:0 6px 16px rgba(176,13,48,.4);z-index:6}
.back{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;width:38px;height:38px;font-size:24px}
.lim{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0}.lim.full #lt{font-weight:700}
.tw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;background:#fff;border-radius:12px}
.tb th,.tb td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
.tb td:first-child,.tb th:first-child{text-align:left}.tb .tot td{font-weight:700;background:#f6f4f3}
.vsug{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vsug img,.vsug2 img{height:24px;background:#fff;border-radius:6px;margin-right:3px;vertical-align:middle}
.vopt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;cursor:pointer}
.vopt.sel{border-color:var(--red);background:#fdf1f4}.vopt.dis{opacity:.55;cursor:default}
.vo-im{display:flex;gap:4px}.vo-im img{height:54px;max-width:96px;object-fit:contain;background:#fff;border-radius:8px}
.vo-w{color:var(--red);font-weight:600;font-size:13px;margin-top:2px}

/* ===== Jarvis qora-binafsha mavzu ===== */
:root{--red:#7c3aed;--red2:#9b5cf6;--bg:#0c0a14;--card:#16131f;--tx:#f4f1ff;--mut:#9b94b8;--line:#2a2440;color-scheme:dark}
body{background:radial-gradient(1200px 500px at 20% -10%,#2a1357 0%,transparent 60%),#0c0a14;background-attachment:fixed}
.hdr{background:linear-gradient(135deg,#5b21b6,#7c3aed);padding:8px 14px 10px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(124,58,237,.35)}
.hdr small{font-size:11px;display:inline;margin-right:6px}.hdr b{font-size:16px}
.hdr .lim{margin-top:6px;font-size:11px}.bar{height:5px}
.search{margin-top:6px;padding:7px 12px;border-radius:12px;font-size:14px}
.chip,.day,.box,.vcard,.inp,.tb,.vopt{background:var(--card);color:var(--tx);border-color:var(--line)}
.chip{color:#cfc8ea}.chip.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.day.on{background:#7c3aed;color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.45)}
.card{border:1px solid var(--line);box-shadow:none}
.img{background-color:#211a33}
.vimg,.vsug img,.vsug2 img,.vo-im img{background:#211a33}
.qty button,.qty input{background:#0c0a14;color:var(--tx);border-color:var(--line)}
.nav{background:#110e1c;border-top:1px solid var(--line)}
.nav button.on{color:#b79cff}
.badge{background:#7c3aed}
.btn.gray{background:#2a2440;color:#f4f1ff}
.inp{color:var(--tx)}
.toast{background:#2a2440}
.fab{box-shadow:0 6px 16px rgba(124,58,237,.5)}
.tb .tot td{background:#211a33}
.vopt.sel{background:#241b3d;border-color:#7c3aed}
.vwarn{background:rgba(124,58,237,.93)}
.login h1,.gb,.vo-w{color:#b79cff}
.back{background:rgba(255,255,255,.18)}

#aurora i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.32;will-change:transform}
#aurora i:nth-child(1){background:radial-gradient(circle,#7c3aed,transparent 65%);top:-30vmax;left:-20vmax;animation:au1 22s ease-in-out infinite alternate}
#aurora i:nth-child(2){background:radial-gradient(circle,#db2777,transparent 65%);bottom:-35vmax;right:-25vmax;opacity:.2;animation:au2 26s ease-in-out infinite alternate}
#aurora i:nth-child(3){background:radial-gradient(circle,#0891b2,transparent 65%);top:40%;left:30%;width:45vmax;height:45vmax;opacity:.13;animation:au3 30s ease-in-out infinite alternate}
@keyframes au1{to{transform:translate(18vmax,14vmax) scale(1.15)}}@keyframes au2{to{transform:translate(-16vmax,-12vmax) scale(1.1)}}@keyframes au3{to{transform:translate(-20vmax,10vmax) scale(1.3)}}
body{background:#0c0a14}
#topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .3s}#topbar.on{opacity:1}
#topbar::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#22d3ee,#d946ef,#8b5cf6,transparent);background-size:50% 100%;background-repeat:no-repeat;animation:tb 1.1s linear infinite}
@keyframes tb{from{background-position:-50% 0}to{background-position:150% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* sarlavha */
.hdr{position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(109,40,217,.95),rgba(76,29,149,.92) 45%,rgba(157,23,77,.88));
  box-shadow:0 14px 34px -12px rgba(124,58,237,.75),inset 0 -1px 0 rgba(255,255,255,.12);animation:hdrIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.hdr::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);animation:shine 5s ease-in-out 1s infinite;pointer-events:none}
@keyframes hdrIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.hdr b{font-family:"Unbounded",system-ui,sans-serif;font-weight:700;letter-spacing:.2px;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.page h2{font-family:"Unbounded",system-ui,sans-serif;font-weight:700;font-size:19px;display:flex;align-items:center;gap:9px}
.page h2::before{content:"";width:4px;height:20px;border-radius:4px;background:linear-gradient(#8b5cf6,#d946ef);box-shadow:0 0 12px #8b5cf6;flex:none}
.search{background:rgba(255,255,255,.14);transition:background .2s,box-shadow .2s}.search:focus{background:rgba(255,255,255,.22);box-shadow:0 0 0 3px rgba(255,255,255,.18)}

/* mahsulot kartalari */
.card{position:relative;background:linear-gradient(160deg,rgba(40,30,70,.6),rgba(22,18,38,.85));border:1px solid rgba(167,139,250,.16);border-radius:22px;
  box-shadow:0 16px 34px -22px rgba(0,0,0,.9);transition:transform .2s,border-color .25s,box-shadow .25s;animation:fadeUp .45s both}
.grid .card:nth-child(1){animation-delay:.02s}.grid .card:nth-child(2){animation-delay:.06s}.grid .card:nth-child(3){animation-delay:.1s}.grid .card:nth-child(4){animation-delay:.14s}
.grid .card:nth-child(5){animation-delay:.18s}.grid .card:nth-child(6){animation-delay:.22s}.grid .card:nth-child(n+7){animation-delay:.26s}
.card:focus-within{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 1px rgba(167,139,250,.35),0 16px 34px -16px rgba(124,58,237,.7)}
.card.has{border-color:rgba(74,222,128,.5);box-shadow:0 0 0 1px rgba(74,222,128,.25),0 14px 30px -16px rgba(34,197,94,.6)}
.img{background-color:#1b1530;transition:transform .5s}.card:active .img{transform:scale(1.04)}
.nm{letter-spacing:.1px}
.qty button{border-radius:12px;transition:transform .12s,background .2s;font-weight:700}
.qty button:active{transform:scale(.86);background:#7c3aed;color:#fff}
.qty input{transition:border-color .2s,box-shadow .2s}.qty input:focus{outline:0;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.25)}

/* chiplar, kunlar */
.chip,.day{transition:transform .15s,background .25s,box-shadow .25s}
.chip:active,.day:active{transform:scale(.93)}
.chip.on,.day.on{background:linear-gradient(135deg,#8b5cf6,#a21caf);border-color:transparent;box-shadow:0 6px 16px -6px rgba(168,85,247,.8)}

/* qutilar */
.box,.vcard,.vopt{background:linear-gradient(160deg,rgba(40,30,70,.55),rgba(22,18,38,.85));border:1px solid rgba(167,139,250,.16);box-shadow:0 14px 30px -22px rgba(0,0,0,.9);animation:fadeUp .45s both}
.page>.box:nth-child(2){animation-delay:.05s}.page>.box:nth-child(3){animation-delay:.1s}.page>.box:nth-child(4){animation-delay:.15s}.page>.box:nth-child(n+5){animation-delay:.2s}
.vopt.sel{background:linear-gradient(150deg,rgba(124,58,237,.35),rgba(30,20,55,.85));border-color:#a78bfa;box-shadow:0 0 22px rgba(139,92,246,.35)}

/* tugmalar */
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#8b5cf6,#6d28d9 55%,#a21caf);background-size:180% 180%;animation:grad 6s ease infinite;
  box-shadow:0 12px 26px -12px rgba(139,92,246,.95),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .2s;letter-spacing:.3px}
.btn:active{transform:scale(.96)}.btn:disabled{filter:grayscale(.6);opacity:.6}
.btn.gray{background:rgba(139,92,246,.1);border:1px solid rgba(167,139,250,.35);color:#ddd2ff;animation:none;box-shadow:none}
.fab{background:linear-gradient(135deg,#8b5cf6,#db2777);animation:fabP 2.6s ease-in-out infinite}
@keyframes fabP{0%,100%{box-shadow:0 6px 16px rgba(124,58,237,.5),0 0 0 0 rgba(168,85,247,.55)}50%{box-shadow:0 6px 16px rgba(124,58,237,.5),0 0 0 12px rgba(168,85,247,0)}}
.fab:active{transform:scale(.9)}
.rpl{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.38);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(4);opacity:0}}

/* maydonlar */
.inp{border-radius:14px;background:rgba(10,8,20,.65);border:1px solid rgba(167,139,250,.22);transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:0;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.25)}

/* pastki menyu */
.nav{background:rgba(17,14,28,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(167,139,250,.18);box-shadow:0 -10px 30px -10px rgba(0,0,0,.8)}
.nav button{position:relative;transition:color .2s}
.nav button i{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nav button.on i{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 0 8px rgba(167,139,250,.8))}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#8b5cf6,#d946ef);box-shadow:0 0 10px #a855f7}
.badge{background:linear-gradient(135deg,#ef4444,#db2777);animation:bdg 1.8s ease-in-out infinite}
@keyframes bdg{50%{transform:scale(1.12)}}

/* jadval, toast, kirish */
.tb{border-radius:14px;overflow:hidden;border:1px solid rgba(167,139,250,.14)}
.tb th{background:linear-gradient(#241b3d,#1d1631);color:#c9bdf5}
.tb tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.toast{background:linear-gradient(135deg,rgba(76,29,149,.95),rgba(30,20,55,.95));border:1px solid rgba(167,139,250,.35);box-shadow:0 14px 30px -10px rgba(0,0,0,.8);animation:tIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes tIn{from{opacity:0;transform:translate(-50%,16px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
.login img{animation:lgIn .7s cubic-bezier(.3,1.6,.4,1) both,lgSpin 2.4s linear .7s infinite;filter:drop-shadow(0 8px 24px rgba(220,30,50,.6))}
@keyframes lgIn{from{opacity:0;transform:scale(.3) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes lgSpin{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}50.01%{transform:rotateY(-90deg)}100%{transform:rotateY(0)}}
.login h1{font-family:"Unbounded",system-ui,sans-serif;font-weight:700;background:linear-gradient(90deg,#e9d5ff,#f472b6,#22d3ee,#e9d5ff);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s linear infinite,fadeUp .5s .15s both}
.login .inp,.login .btn,.login .mut{animation:fadeUp .5s .25s both}
.load{animation:pulseT 1.4s ease-in-out infinite}@keyframes pulseT{50%{opacity:.45}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(167,139,250,.35);border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
// ====== SOZLAMA: o'z Render manzilingizni yozing (oxirida "/" siz) ======
const API_BASE = location.hostname === "localhost" ? "https://zakas-bot.onrender.com" : location.origin;
// =======================================================================

const ERR = {
  not_allowed: "Sizga ruxsat berilmagan. Admin bilan bog'laning.",
  wrong_code: "Kod noto'g'ri.", too_many_attempts: "Juda ko'p urinish. 10 daqiqadan keyin urinib ko'ring.",
  code_too_short: "Kod kamida 4 ta belgidan iborat bo'lsin.", closed: "Hozir buyurtma qabul qilish vaqti emas.",
  empty_order: "Savat bo'sh.", bad_date: "Sana noto'g'ri.", exists: "Bu raqam allaqachon bor.",
  bad_input: "Ism va to'liq telefon raqam (9 ta raqam) kiriting.", bad_excel: "Excel faylni o'qib bo'lmadi.",
  empty_excel: "Excelda mahsulot/narx topilmadi.", no_file: "Fayl tanlanmadi.", bad_time: "Vaqt noto'g'ri (SS:DD).",
  network: "Internetga ulanib bo'lmadi. Server uyg'onayotgan bo'lishi mumkin, qayta urinib ko'ring.",
  upload_failed: "Rasm yuklanmadi.", storage_not_configured: "Rasm saqlash sozlanmagan.",
  limit_full: "Buyurtma limiti to'ldi.", min_kg: "Bu avto uchun minimal hajm to'lmagan.", bad_vehicle: "Avtomobil tanlanmagan.",
  daily_limit: "Bu kunga zakas berib bo'lgansiz. Yana kerak bo'lsa ＋ tugmasi orqali adminga yozing.",
  weekly_limit: "Bu avtomobil shu haftada ishlatilgan (haftada 1 marta). ＋ tugmasi orqali adminga yozing.",
  empty_text: "Xabar yozing.", vehicle_taken: "Bu kunga bu avtomobilga boshqa filial buyurtma bergan. ＋ tugmasi orqali adminga yozing.", day_closed: "Bu kunga zakas qabul qilinmaydi.",
  vehicle_mismatch: "Bu avtomobilga yuk sig'maydi.", already_confirmed: "Bu zakas allaqachon tasdiqlangan.", not_confirmed: "Bu zakas hali tasdiqlanmagan.", not_found: "Zakas topilmadi."
};
const WD = ["Ya","Du","Se","Cho","Pa","Ju","Sh"];
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Math.round(n).toLocaleString("ru").replace(/\u00a0/g, " ");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = n => n.replace(/\s*\*[^*]*\*\s*$/, "").trim();
const ld = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const VEH = {
  labo: { name: "Labo", img: "img/labo.jpg", info: "Har biri 1 tonnagacha (1 yoki 2 ta)" },
  shinaray: { name: "Shinaray", img: "img/shinaray.jpg", info: "2 000–2 200 kg · filialga haftada 1 marta" },
  isuzi: { name: "Isuzi", img: "img/isuzi.jpg", info: "2 000 kg dan 10 tonnagacha" }
};
const LABO = 1000, MAXKG = 10000;
// Zakas hajmiga mos avtomobil variantlari (serverdagi vehicle_ok bilan bir xil qoida)
function suggest(t) {
  if (t <= 0) return [];
  if (t <= LABO) return [{ veh: "labo", n: 1 }];
  if (t <= 2 * LABO) return [{ veh: "labo", n: 2 }];
  if (t <= 2200) return [{ veh: "shinaray", n: 1 }, { veh: "isuzi", n: 1 }];
  if (t <= MAXKG) return [{ veh: "isuzi", n: 1 }];
  return [];
}
const optName = o => o.veh === "labo" && o.n > 1 ? `${o.n} ta Labo` : VEH[o.veh].name;
const optImgs = o => Array.from({ length: o.n }, () => `<img src="${VEH[o.veh].img}" alt="">`).join("");
const DONA_KG = 0.4;
const r2 = n => Math.round(n * 100) / 100;
const eqKg = cart => Object.values(cart).reduce((s, c) => s + (c.unit === "dona" ? c.qty * DONA_KG : c.qty), 0);
const S = { token: localStorage.getItem("tk") || "", user: JSON.parse(localStorage.getItem("us") || "null"),
  catalog: {}, cat: null, q: "", date: null, tab: "menu", cart: JSON.parse(localStorage.getItem("cart") || "{}"),
  status: {}, adminTab: "users", cdate: null };

async function api(path, o = {}) {
  const h = {}; let body = o.body;
  if (S.token) h.Authorization = "Bearer " + S.token;
  if (body !== undefined && !(body instanceof Blob) && !(body instanceof FormData)) { body = JSON.stringify(body); h["Content-Type"] = "application/json"; }
  if (o.type) h["Content-Type"] = o.type;
  let r, d = {};
  try { r = await fetch(API_BASE + "/api/v2" + path, { method: o.method || (body !== undefined ? "POST" : "GET"), headers: h, body });
        try { d = await r.json(); } catch (e) {} }
  catch (e) { throw new Error("network"); }
  if (S.token && (r.status === 401 || d.error === "not_allowed")) { logout(); throw new Error("not_allowed"); }
  if (!r.ok || d.ok === false) { const er = new Error(d.error || "network"); er.detail = d.detail; throw er; }
  return d;
}
const say = e => (ERR[e.message] || ("Xato: " + e.message)) + (e.detail ? " [" + e.detail + "]" : "");
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function logout() { S.token = ""; S.user = null; localStorage.removeItem("tk"); localStorage.removeItem("us"); renderLogin(); }
const saveCart = () => localStorage.setItem("cart", JSON.stringify(S.cart));

// ---------------------------------------------------------------- KIRISH
function renderLogin(step = "phone", phone = "") {
  $("#app").innerHTML = `<div class="login">
    <img src="logo.png" alt="" onerror="this.style.display='none'"><h1>Meat City</h1>
    <div class="mut" style="text-align:center">${step === "phone" ? "Telefon raqamingizni kiriting" : step === "new" ? "Yangi kod o'ylab toping (kamida 4 ta belgi). Keyingi safar shu kod bilan kirasiz." : "Kodingizni kiriting"}</div>
    <input id="ph" class="inp" type="tel" placeholder="+998 90 123 45 67" value="${esc(phone)}" ${step !== "phone" ? "readonly" : ""}>
    ${step !== "phone" ? `<input id="cd" class="inp" type="password" inputmode="numeric" placeholder="Kod" autofocus>` : ""}
    <div class="err" id="er"></div>
    <button class="btn" id="go">${step === "phone" ? "Davom etish" : "Kirish"}</button>
    ${step !== "phone" ? `<button class="btn gray" style="margin-top:8px" id="bk">Orqaga</button>` : ""}</div>`;
  const er = m => $("#er").textContent = m;
  if ($("#bk")) $("#bk").onclick = () => renderLogin();
  $("#go").onclick = async () => {
    const ph = $("#ph").value.trim(); er(""); $("#go").disabled = true;
    try {
      if (step === "phone") {
        const r = await api("/check", { body: { phone: ph } });
        if (r.status === "denied") er(ERR.not_allowed); else renderLogin(r.status, ph);
      } else {
        const r = await api("/login", { body: { phone: ph, code: $("#cd").value.trim(), initData: (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || "" } });
        S.token = r.token; S.user = r.user; localStorage.setItem("tk", r.token); localStorage.setItem("us", JSON.stringify(r.user));
        start();
      }
    } catch (e) { er(say(e)); }
    if ($("#go")) $("#go").disabled = false;
  };
}

// ---------------------------------------------------------------- BOSHLASH
async function start() {
  $("#app").innerHTML = `<div class="load">Yuklanmoqda…<br><span class="mut">Birinchi ochilishda 30–60 soniya kutish mumkin</span></div>`;
  try {
    const r = await api("/products"); S.catalog = r.catalog; S.status = r; S.pending = r.pending || 0;
    S.cat = S.cat && S.catalog[S.cat] ? S.cat : Object.keys(S.catalog)[0];
    pickDate(); shell(); show(S.tab === "home" ? "menu" : S.tab);
  } catch (e) {
    if (!S.token) return;
    $("#app").innerHTML = `<div class="load">${esc(say(e))}<br><br><button class="btn sm" onclick="start()">Qayta urinish</button></div>`;
  }
}
function days() {
  const out = [], t = new Date(), od = S.status.order_days;  // od: admin belgilagan kunlar (null — belgilanmagan)
  for (let i = 0; i < 14; i++) { const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i), key = ld(d);
    if (od ? !od.includes(key) : i >= 8) continue;
    out.push({ i, d, key, off: (!od && d.getDay() === 0) || (i === 0 && !S.status.order_open) }); }
  return out;
}
function pickDate() { const ds = days(); if (!ds.find(x => x.key === S.date && !x.off)) { const x = ds.find(d => d.i >= 1 && !d.off) || ds.find(d => !d.off); S.date = x ? x.key : null; } }

function shell() {
  $("#app").innerHTML = `<div id="view"></div><div class="nav" id="nav"></div>`;
  $("#nav").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.t); };
  navUpdate();
}
function navUpdate() {
  const n = Object.keys(S.cart).length, t = S.tab;
  const items = [["menu","🏠","Menyu"],["cart","🛒","Savat"],["hist","🕘","Tarix"],["ctl","📊","Kontrol"]];
  if (S.user && S.user.is_admin) items.push(["adm","⚙️","Sozlamalar"]);
  $("#nav").innerHTML = items.map(([k, ic, l]) => `<button data-t="${k}" class="${t === k ? "on" : ""}"><i>${ic}</i>${l}${k === "cart" && n ? `<span class="badge">${n}</span>` : ""}${k === "adm" && S.pending ? `<span class="badge">${S.pending}</span>` : ""}</button>`).join("");
}
function show(t) {
  if (t === "home") t = "menu";
  S.tab = t; navUpdate(); $("#view").onclick = null; $("#view").onchange = null; ({ menu: viewMenu, cart: viewCart, hist: viewHist, ctl: viewControl, adm: viewAdmin })[t](); window.scrollTo(0, 0); }

// ---------------------------------------------------------------- MENYU
function plusDialog() {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="box" style="color:#222;width:100%;max-width:420px;text-align:left"><b>Qo'shimcha avto so'rash</b>
    <div class="mut">Masalan: «Ertaga 2 ta Labo kerak». Xabar adminga sizning nomingizdan boradi.</div>
    <textarea id="pm" class="inp" rows="4" placeholder="Xabar yozing…"></textarea>
    <div style="display:flex;gap:8px"><button class="btn gray" id="pc">Bekor</button><button class="btn" id="pg">Yuborish</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov || e.target.id === "pc") ov.remove(); };
  $("#pg", ov).onclick = async () => { const t = $("#pm", ov).value.trim(); if (!t) return toast(ERR.empty_text);
    $("#pg", ov).disabled = true;
    try { await api("/request", { body: { text: t } }); ov.remove(); toast("✅ So'rov yuborildi"); }
    catch (e) { toast(say(e)); $("#pg", ov).disabled = false; } };
}
function sugHtml(kg) {
  const o = suggest(kg);
  if (kg <= 0) return `🚚 Avtomobil zakas hajmiga qarab oxirida tanlanadi`;
  if (!o.length) return `⛔ Hajm ${MAXKG} kg dan oshdi`;
  return "🚚 " + o.map(x => `${optImgs(x)}<b>${optName(x)}</b>`).join(" yoki ");
}
function updateLim() {
  const t = $("#lt"); if (!t) return; const kg = r2(eqKg(S.cart));
  t.textContent = `${kg} / ${MAXKG} kg`;
  $("#lb").style.width = Math.min(100, kg / MAXKG * 100) + "%"; t.parentNode.classList.toggle("full", kg >= MAXKG - 1e-9);
  const sg = $("#vsug"); if (sg) sg.innerHTML = sugHtml(kg);
}
function viewMenu() {
  $("#view").innerHTML = `<div class="hdr"><div><small>Xush kelibsiz,</small><b>${esc(S.user.name)}</b></div>
    <div class="lim"><div class="bar"><i id="lb"></i></div><span id="lt"></span></div>
    <div class="vsug" id="vsug"></div>
    <input id="q" class="search" placeholder="Mahsulot qidirish…" value="${esc(S.q)}"></div>
    <div class="row" id="days"></div><div class="row" id="cats"></div><div class="grid" id="grid"></div>
    <button class="fab" id="plus" aria-label="Qo'shimcha avto so'rash">＋</button>`;
  $("#q").oninput = e => { S.q = e.target.value; grid(); };
  $("#plus").onclick = plusDialog;
  drawDays(); drawCats(); grid(); updateLim();
}
function drawDays() {
  const ds = days();
  if (!ds.length) { $("#days").innerHTML = `<div class="mut" style="padding:10px 4px">Admin hali zakas kunlarini belgilamagan.</div>`; return; }
  $("#days").innerHTML = ds.map(x => `<div class="day ${x.key === S.date ? "on" : ""} ${x.off ? "off" : ""}" data-d="${x.key}"><small>${x.i === 0 ? "Bugun" : x.i === 1 ? "Ertaga" : WD[x.d.getDay()]}</small><b>${x.d.getDate()}</b></div>`).join("");
  $("#days").onclick = e => { const d = e.target.closest(".day"); if (d && !d.classList.contains("off")) { S.date = d.dataset.d; drawDays(); } };
}
function drawCats() {

function card(p) {
  const c = S.cart[p.id], u = c ? c.unit : "kg";
  return `<div class="card" data-id="${p.id}" data-unit="${u}">
    <div class="img" data-img="${p.id}" style="${p.image ? `background-image:url('${esc(p.image)}')` : ""}">${p.image ? "" : "🥩"}</div>

    <div class="qty"><button data-m="-">−</button><input type="number" inputmode="decimal" min="0" step="any" value="${c ? c.qty : ""}" placeholder="0"><button data-m="+">+</button></div>
    <div class="unit" data-u="1">${u} ⇄</div></div></div>`;
}
const prod = id => Object.values(S.catalog).flat().find(p => p.id == id);
function setQty(id, qty, unit, quiet) {
  qty = Math.max(0, Math.round(qty * 100) / 100);
  const old = S.cart[id], u = unit || (old ? old.unit : "kg");
  const next = Object.assign({}, S.cart); if (qty <= 0) delete next[id]; else next[id] = { qty, unit: u };
  { const mx = MAXKG;
    if (r2(eqKg(next)) > mx + 1e-9) { const left = Math.max(0, r2(mx - eqKg(S.cart)));
      if (!quiet) toast("Buyurtma limiti to'ldi" + (left > 0 ? ` (yana ${left} kg sig'adi)` : "")); return false; } }
  if (qty <= 0) delete S.cart[id]; else S.cart[id] = { qty, unit: u };
  saveCart(); navUpdate(); updateLim(); return true;
}
const cardUnit = cd => cd.dataset.unit === "dona" ? "dona" : "kg";
function gridClick(e) {
  const cd = e.target.closest(".card"); if (!cd) return; const id = +cd.dataset.id, c = S.cart[id], inp = $("input", cd);
  const m = e.target.closest("[data-m]");
  if (m) { const v = (parseFloat(inp.value) || 0) + (m.dataset.m === "+" ? 1 : -1); setQty(id, v, cardUnit(cd)); inp.value = S.cart[id] ? S.cart[id].qty : ""; return; }
  if (e.target.closest("[data-u]")) { const u = cardUnit(cd) === "kg" ? "dona" : "kg", qv = c ? c.qty : (parseFloat(inp.value) || 0);
    if (qv > 0 && !setQty(id, qv, u, true)) { toast(`${u === "kg" ? "Kg" : "Dona"} ga o'tkazsangiz limitdan oshadi. Avval miqdorni kamaytiring.`); return; }
    cd.dataset.unit = u; $(".unit", cd).textContent = u + " ⇄"; $(".pr", cd).textContent = `${fmt(prod(id).price)} so'm/${u}`; return; }
  if (e.target.closest("[data-img]")) viewer(id);
}
function gridChange(e) { if (e.target.tagName !== "INPUT") return; const cd = e.target.closest(".card"), id = +cd.dataset.id;

function viewer(id) {
  const p = prod(id), ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `${p.image ? `<img src="${esc(p.image)}">` : `<div style="font-size:90px">🥩</div>`}<div><b>${esc(clean(p.name))}</b><br>${fmt(p.price)} so'm</div>
    ${S.user.is_admin ? `<button class="btn sm" id="chg">📷 Rasmni o'zgartirish</button><input id="fl" type="file" accept="image/*" hidden>` : ""}
    <button class="btn sm gray" id="cl">Yopish</button>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov || e.target.id === "cl") ov.remove(); };

    $("#chg", ov).onclick = () => $("#fl", ov).click();
    $("#fl", ov).onchange = async e => {
      const f = e.target.files[0]; if (!f) return; toast("Yuklanmoqda…");
      try { const blob = await shrink(f, 900); const r = await api(`/admin/products/${id}/image`, { body: blob, type: "image/jpeg" });
        p.image = r.image; ov.remove(); grid(); toast("Rasm yangilandi"); } catch (er) { toast(say(er)); }
    };
  }
}
function shrink(file, max) {
  return new Promise((res, rej) => { const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("bad_image")), "image/jpeg", 0.85); URL.revokeObjectURL(u); };
    im.onerror = () => rej(new Error("bad_image")); im.src = u; });
}

    $("#ts").onclick = async () => { try { const r = await api("/admin/settings", { body: { open_time: $("#t1").value, cutoff_time: $("#t2").value } }); Object.assign(S.status, r); toast("Saqlandi"); } catch (e) { toast(say(e)); } };
  } catch (e) { el.innerHTML = `<div class="err">${esc(say(e))}</div>`; }
}
async function admDays() {
  const el = $("#ad"); el.innerHTML = `<div class="load">Yuklanmoqda…</div>`;
  try {
    const s = await api("/admin/settings"), sel = new Set(s.order_days || []), t = new Date(), ds = [];
    for (let i = 0; i < 14; i++) { const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i); ds.push({ i, d, key: ld(d) }); }
    const draw = () => { el.innerHTML = `<div class="box"><b>Zakas qabul qilinadigan kunlar</b>
      <div class="mut">${s.order_days ? "Foydalanuvchilar faqat belgilangan kunlarga zakas bera oladi." : "Hali belgilanmagan: hozir Yakshanbadan boshqa kunlar ochiq. Saqlasangiz faqat tanlangan kunlar ochiq bo'ladi."}</div>
      <div id="dg" style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">${ds.map(x => `<div class="day ${sel.has(x.key) ? "on" : ""}" data-k="${x.key}"><small>${x.i === 0 ? "Bugun" : x.i === 1 ? "Ertaga" : WD[x.d.getDay()]}</small><b>${x.d.getDate()}</b><small>${String(x.d.getMonth() + 1).padStart(2, "0")}</small></div>`).join("")}</div>
      <button class="btn" id="dsv">Saqlash</button></div>`;
      $("#dg").onclick = e => { const d = e.target.closest("[data-k]"); if (!d) return; sel.has(d.dataset.k) ? sel.delete(d.dataset.k) : sel.add(d.dataset.k); d.classList.toggle("on"); };
      $("#dsv").onclick = async () => { try { const r = await api("/admin/settings", { body: { order_days: [...sel] } }); Object.assign(S.status, r); s.order_days = r.order_days; pickDate(); toast("Saqlandi"); draw(); } catch (e) { toast(say(e)); } }; };
    draw();
  } catch (e) { el.innerHTML = `<div class="err">${esc(say(e))}</div>`; }
}
// Admin zakasga avtolarni o'zi tanlaydi (masalan 1 Shinaray + 1 Labo). Jami sig'im zakas hajmidan kam bo'lmasligi kerak.
const CAPV = { labo: LABO, shinaray: 2200, isuzi: MAXKG };
const VORDER = ["isuzi", "shinaray", "labo"];
const eqOf = o => r2(o.items.reduce((s, i) => s + (i.unit === "dona" ? i.qty * DONA_KG : i.qty), 0));
const dmy = s => s.split("-").reverse().join(".");
const vlabel = vs => VORDER.filter(k => vs && vs[k]).map(k => VEH[k].name + (vs[k] > 1 ? " ×" + vs[k] : "")).join(" + ");
const capOf = c => VORDER.reduce((s, k) => s + (c[k] || 0) * CAPV[k], 0);
async function admOrders() {
  const CNT = {}; let list = [];   // CNT[orderId] = { labo: n, shinaray: n, isuzi: n }
  const el = $("#ad");
  el.innerHTML = `<div class="tabs"><button class="chip ${S.ordTab !== "date" ? "on" : ""}" data-ot="pending">⏳ Tasdiq kutayotgan</button><button class="chip ${S.ordTab === "date" ? "on" : ""}" data-ot="date">📅 Sana bo'yicha</button></div>
    ${S.ordTab === "date" ? `<input id="od" type="date" class="inp" value="${S.date || ld(new Date())}">` : ""}<div id="ol" class="load">Yuklanmoqda…</div>`;
  const items = o => o.items.map(i => `<div class="line"><span>${esc(clean(i.name))}</span><span>${i.qty} ${i.unit}</span></div>`).join("")
    + `<div class="line"><b>Jami</b><b>${o.total_kg ? o.total_kg + " kg " : ""}${o.total_dona ? o.total_dona + " dona" : ""}</b></div>`;
  const EDIT = {};   // EDIT[orderId] = true — tasdiqlangan zakasning avtosi tahrirlanmoqda
  const cntOf = o => { if (!CNT[o.id]) { const c = { labo: 0, shinaray: 0, isuzi: 0 };
      if (o.status === "confirmed") VORDER.forEach(k => { c[k] = (o.vehicles && o.vehicles[k]) || 0; });
      else if (o.asked_vehicle && c[o.asked_vehicle] !== undefined) c[o.asked_vehicle] = o.asked_n || 1;
      CNT[o.id] = c; } return CNT[o.id]; };
  const box = o => {
    const del = `<button class="btn sm gray" style="color:#c00" data-del="${o.id}">🗑 O'chirish</button>`;
    const editing = o.status === "confirmed" && EDIT[o.id];
    if (o.status !== "pending" && !editing) return `<div class="box"><b>#${o.id} · ${esc(o.user)}${vlabel(o.vehicles) ? " · " + vlabel(o.vehicles) : ""} ✅</b><div class="mut">${dmy(o.date)} · ${o.created_at}</div>${items(o)}<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-ed="${o.id}">✏️ Avtoni o'zgartirish</button>${del}</div></div>`;
    const eq = eqOf(o), c = cntOf(o), cap = capOf(c), okc = cap >= eq - 1e-6 && cap > 0, asked = vlabel(o.asked_vehicle ? { [o.asked_vehicle]: o.asked_n || 1 } : null) || "—";
    const btns = editing
      ? `<button class="btn sm" data-sv="${o.id}" ${okc ? "" : "disabled"}>💾 Saqlash</button><button class="btn sm gray" data-ec="${o.id}">Bekor qilish</button>`
      : `<button class="btn sm" data-ok="${o.id}" ${okc ? "" : "disabled"}>✅ Tasdiqlash</button>${del}`;
    return `<div class="box" data-id="${o.id}"><b>#${o.id} · ${esc(o.user)}${editing ? " ✅" : ""}</b><div class="mut">📅 ${dmy(o.date)} · ${o.created_at} · ${editing ? "hozirgi avto: " + (vlabel(o.vehicles) || "—") : "so'ragan avto: " + asked}</div>${items(o)}
      <div class="line"><span>Hajm</span><b>${eq} kg</b></div>
      <div class="mut" style="margin:8px 0 2px">${editing ? "Yangi avtomobillarni belgilang:" : "Avtomobillarni o'zingiz belgilang:"}</div>
      ${VORDER.map(k => { const w = c[k] > 0 && o.warn && o.warn[k]; return `<div class="vopt ${c[k] ? "sel" : ""}"><div class="vo-im"><img src="${VEH[k].img}" alt=""></div>
        <div style="flex:1"><b>${VEH[k].name}</b><div class="mut">${CAPV[k]} kg</div>${w ? `<div class="vo-w">⚠ ${esc(w)}</div>` : ""}</div>
        <div class="qty" style="width:128px;flex:none"><button data-cm="${o.id}:${k}:-1">−</button><b style="min-width:26px;text-align:center">${c[k]}</b><button data-cm="${o.id}:${k}:1">+</button></div></div>`; }).join("")}
      <div class="line"><span>Sig'im</span><b style="color:${okc ? "#4ade80" : "#f87171"}">${cap} / ${eq} kg</b></div>
      ${okc ? "" : `<div class="err" style="min-height:0">${cap ? "Tanlangan avtolar yukni ko'tarmaydi." : "Kamida bitta avto tanlang."}</div>`}
      <div style="display:flex;gap:8px;margin-top:8px">${btns}</div></div>`;
  };
  const draw = () => { $("#ol").className = ""; $("#ol").innerHTML = list.length ? list.map(box).join("") : `<div class="load">${S.ordTab === "date" ? "Bu sanaga buyurtma yo'q" : "Tasdiq kutayotgan zakas yo'q"}</div>`; };
  const load = async () => { try {
      const q = S.ordTab === "date" ? "date=" + $("#od").value : "status=pending";
      list = (await api("/admin/orders?" + q)).orders;
      if (S.ordTab !== "date") { S.pending = list.length; navUpdate(); }
      draw();
    } catch (e) { $("#ol").className = "err"; $("#ol").textContent = say(e); } };
  el.onclick = async e => {
    const t = e.target.closest("[data-ot]"); if (t) { S.ordTab = t.dataset.ot; return admOrders(); }
    const cm = e.target.closest("[data-cm]"); if (cm) { const [id, k, d] = cm.dataset.cm.split(":"), c = CNT[id]; c[k] = Math.max(0, Math.min(10, c[k] + +d)); return draw(); }
    const ed = e.target.closest("[data-ed]"); if (ed) { EDIT[ed.dataset.ed] = true; delete CNT[ed.dataset.ed]; return draw(); }
    const ec = e.target.closest("[data-ec]"); if (ec) { delete EDIT[ec.dataset.ec]; delete CNT[ec.dataset.ec]; return draw(); }
    const sv = e.target.closest("[data-sv]");
    if (sv) { const o = list.find(x => x.id == sv.dataset.sv), c = cntOf(o), chosen = VORDER.filter(k => c[k] > 0);
      if (vlabel(o.vehicles) === vlabel(c)) { delete EDIT[o.id]; delete CNT[o.id]; return draw(); }   // o'zgarish yo'q
      if (!confirm(`#${o.id}: ${vlabel(o.vehicles) || "—"} → ${vlabel(c)}\n\nAvto almashtirilsin va guruhga xabar yuborilsinmi?`)) return;
      sv.disabled = true;
      try { const r = await api(`/admin/orders/${o.id}/vehicles`, { body: { vehicles: Object.fromEntries(chosen.map(k => [k, c[k]])) } });
        delete EDIT[o.id]; delete CNT[o.id];
        toast(r.sent ? `✅ Avto ${vlabel(c)} ga almashtirildi, guruhga xabar yuborildi` : "⚠ Almashtirildi, lekin guruhga yuborib bo'lmadi"); load();
      } catch (er) { toast(say(er)); sv.disabled = false; }
      return; }
    const ok = e.target.closest("[data-ok]");
    if (ok) { const o = list.find(x => x.id == ok.dataset.ok), c = cntOf(o), chosen = VORDER.filter(k => c[k] > 0);
      const ws = chosen.filter(k => o.warn && o.warn[k]).map(k => `${VEH[k].name}: ${o.warn[k]}`);
      if (ws.length && !confirm(`⚠ ${ws.join("\n⚠ ")}\n\nBaribir tasdiqlaysizmi?`)) return;
      ok.disabled = true;
      try { const r = await api(`/admin/orders/${o.id}/confirm`, { body: { vehicles: Object.fromEntries(chosen.map(k => [k, c[k]])) } });
        toast(r.sent ? `✅ ${vlabel(c)} tasdiqlandi, guruhga yuborildi` : "⚠ Tasdiqlandi, lekin guruhga yuborib bo'lmadi"); load();
      } catch (er) { toast(say(er)); ok.disabled = false; if (er.message === "already_confirmed") load(); }
      return; }
    const b = e.target.closest("[data-del]"); if (!b || !confirm(`#${b.dataset.del} buyurtma o'chirilsinmi?`)) return;
    try { await api("/admin/orders/" + b.dataset.del, { method: "DELETE" }); toast("O'chirildi"); load(); } catch (er) { toast(say(er)); } };
  if ($("#od")) $("#od").onchange = load;
  load();
}

// ---------------------------------------------------------------- ISHGA TUSHIRISH
(async function boot() {
  try { // Jarvis'dan avtomatik kirish: #jt=token&ju=user
    const hp = new URLSearchParams(location.hash.slice(1));
    if (hp.get("jt")) { localStorage.setItem("tk", hp.get("jt")); S.token = hp.get("jt");
      if (hp.get("ju")) { localStorage.setItem("us", hp.get("ju")); S.user = JSON.parse(hp.get("ju")); }
      history.replaceState(null, "", location.pathname); }
  } catch (e) {}
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try {
      const r = await api("/tg-login", { body: { initData: tg.initData } });
      S.token = r.token; S.user = r.user; localStorage.setItem("tk", r.token); localStorage.setItem("us", JSON.stringify(r.user));
      return start();
    } catch (e) { /* admin emas: telefon + kod bilan kiradi */ }
  }
  if (S.token && S.user) start(); else renderLogin();
})();
</script>
<script>
// ===================== PREMIUM KO'RINISH: animatsiyalar =====================
(function(){try{
  var au=document.createElement("div");au.id="aurora";au.innerHTML="<i></i><i></i><i></i>";document.body.insertBefore(au,document.body.firstChild);
  var tb=document.createElement("div");tb.id="topbar";document.body.appendChild(tb);
  var busy=0,_f=window.fetch.bind(window);
  window.fetch=function(){busy++;tb.classList.add("on");return _f.apply(null,arguments).finally(function(){busy=Math.max(0,busy-1);if(!busy)setTimeout(function(){if(!busy)tb.classList.remove("on")},250)})};
  document.addEventListener("pointerdown",function(e){var b=e.target.closest&&e.target.closest(".btn,.chip,.day,.qty button,.nav button,.fab");if(!b)return;
    var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");s.className="rpl";s.style.width=s.style.height=d+"px";
    s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";if(getComputedStyle(b).position==="static")b.style.position="relative";b.style.overflow="hidden";b.appendChild(s);setTimeout(function(){s.remove()},650)},{passive:true});
  // miqdor kiritilgan kartalar yashil chiziq bilan ajralib turadi
  function mark(){document.querySelectorAll(".card").forEach(function(c){var i=c.querySelector(".qty input");if(i)c.classList.toggle("has",parseFloat(String(i.value).replace(",","."))>0)})}
  document.addEventListener("input",function(e){if(e.target.closest&&e.target.closest(".qty"))mark()});
  document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".qty"))setTimeout(mark,30)});
  new MutationObserver(function(){clearTimeout(mark.t);mark.t=setTimeout(mark,60)}).observe(document.getElementById("app"),{childList:true,subtree:true});
}catch(e){console.log("theme",e)}})();
</script>
